<script>
  /* Se aplica el tema antes de pintar, para que no haya parpadeo al cargar. */
  try {
    var t = localStorage.getItem('diay-theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
  /* Campaña del mes. La lista y sus zonas viven en CAMPANAS (armazon.py);
     aquí solo se elige la que toca hoy, o la de ?campana=<id> para probar. */
  try {
    var C = [{"id": "octubre-rosa", "desde": "10-01", "hasta": "10-31", "zonas": "linea resplandor pastilla lema boton opina aviso logo", "colores": {"claro": {"principal": "#E0457B", "fuerte": "#C2185B", "suave": "#FDE2EC"}, "oscuro": {"principal": "#F472B6", "fuerte": "#F9A8D4", "suave": "#3A1626"}}}], r = document.documentElement, d = new Date();
    var hoy = ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    var pedida = (location.search.match(/[?&]campana=([a-z0-9-]+)/) || [])[1];
    var c = C.filter(function (x) {
      if (pedida) return x.id === pedida;
      return x.desde <= x.hasta ? (hoy >= x.desde && hoy <= x.hasta) : (hoy >= x.desde || hoy <= x.hasta);
    })[0];
    if (c) {
      r.dataset.campana = c.id;
      r.dataset.zonas = c.zonas;
      ['claro', 'oscuro'].forEach(function (m) {
        ['principal', 'fuerte', 'suave'].forEach(function (t) {
          r.style.setProperty('--campana-' + t + '-' + m, c.colores[m][t]);
        });
      });
      /* Lo que depende de cual campana es: su tarjeta y su logo. */
      var z = ' ' + c.zonas + ' ', sel = '[data-campana="' + c.id + '"]', css = '';
      if (z.indexOf(' aviso ') >= 0) css += '.campana-aviso' + sel + '{display:flex}';
      if (z.indexOf(' logo ') >= 0) css += '.logo-light,.logo-dark{display:none!important}'
        + '.logo-campana--claro' + sel + '{display:revert}'
        + ':root[data-theme="dark"] .logo-campana--claro' + sel + '{display:none}'
        + ':root[data-theme="dark"] .logo-campana--oscuro' + sel + '{display:block}';
      if (css) {
        var st = document.createElement('style');
        st.textContent = css;
        document.head.appendChild(st);
      }
    }
  } catch (e) {}
</script>
